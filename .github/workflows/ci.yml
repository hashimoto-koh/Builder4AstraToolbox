name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Recipe Validation & Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - uses: julia-actions/cache@v2

      - name: Instantiate environment
        run: |
          julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Validate build_tarballs.jl with meta-json
        run: |
          julia --startup-file=no --project=. build_tarballs.jl x86_64-linux-gnu-cxx11-cuda+12.8 --meta-json
